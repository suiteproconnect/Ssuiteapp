kind = "web"
previewPath = "/"
title = "spaceSUITE"
description = "La app original spaceSUITE: salas grupales de video, chat en vivo, comunidad para compartir fotos y videos, y conexiones entre adultos."
version = "1.0.0"
id = "artifacts/spacesuite-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19694

[services.development]
run = "pnpm run dev"

[services.production]
build = [ "pnpm", "run", "build" ]

[services.production.run]
args = [ "node", "--experimental-strip-types", "dev-server.mjs" ]

[services.production.run.env]
PORT = "19694"
NODE_ENV = "production"

[services.env]
PORT = "19694"
BASE_PATH = "/"
